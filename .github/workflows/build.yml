name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk SvBooster.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SvBooster-apk
          path: SvBooster.apk
      - name: Publicar em Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sv Booster build ${{ github.run_number }}
          files: SvBooster.apk
